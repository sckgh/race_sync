name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (pyflakes-critical errors only)
        run: ruff check --select E9,F63,F7,F82 src tests

      - name: Syntax check
        run: python -m compileall -q src

      - name: Tests
        run: pytest -q

      - name: CLI smoke
        run: |
          python -m racesync.cli demo --seconds 30 >/dev/null
          python -m racesync.cli gen-nmea --cars 5 --rate 5 --duration 5 --out /tmp/nmea >/dev/null
          python -m racesync.cli spike examples/sample_feed.jsonl >/dev/null
          python -m racesync.cli spike --nmea-dir /tmp/nmea >/dev/null
          python -m racesync.cli console >/dev/null
          python -m racesync.cli visualize examples/sample_feed.jsonl --out /tmp/cars.svg >/dev/null
