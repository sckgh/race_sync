[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "racesync"
version = "0.1.0"
description = "Sync real race-car position/timing into a simulator alongside a virtual field (see specs/)."
readme = "README.md"
requires-python = ">=3.11"  # uses ExceptionGroup (bus.py)
# Core is intentionally dependency-free (stdlib only) so the backbone runs anywhere,
# including trackside on minimal hardware. Optional extras pull in adapter-specific deps.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[project.scripts]
racesync = "racesync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
